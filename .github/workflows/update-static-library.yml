name: Update Static Songs Library

on:
  workflow_dispatch:
  repository_dispatch:
    types: [supabase_song_update]
  schedule:
    - cron: '0 0 * * *' # Nightly at midnight UTC

permissions:
  contents: write

jobs:
  export-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export Static Library from Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run export:static

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/exports/
          if git diff --staged --quiet; then
            echo "No static export changes to commit."
          else
            git commit -m "chore: auto-update static songs export from Supabase"
            git push
          fi
